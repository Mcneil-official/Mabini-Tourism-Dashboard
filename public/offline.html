<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Mabini Tourism</title>
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --primary: #0284c7;
        --primary-hover: #0369a1;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      max-width: 28rem;
      width: 100%;
      padding: 2.25rem 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }
    .icon-wrap {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background: rgba(2, 132, 199, 0.12);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-wrap svg {
      width: 2rem;
      height: 2rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 2.5rem;
      padding: 0 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.5rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.primary {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
    }
    button.primary:hover {
      background-color: var(--primary-hover);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .pulse-dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="pulse-dot"></span>
      No Internet Connection
    </div>
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>
      The Mabini Tourism Dashboard requires an active network connection to synchronize real-time dive manifests, operator registrations, and payment receipts.
    </p>
    <div class="actions">
      <button class="primary" onclick="window.location.reload()">
        Try Reconnecting
      </button>
    </div>
  </div>
</body>
</html>
