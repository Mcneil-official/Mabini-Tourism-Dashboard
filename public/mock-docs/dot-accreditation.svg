      <text x="0" y="-16" font-size="8" font-weight="bold" fill="#4f46e5" text-anchor="middle">DOT REGION IV-A</text>
      <text x="0" y="3" font-size="12" font-weight="bold" fill="#4f46e5" text-anchor="middle">ACCREDITED</text>
      <text x="0" y="18" font-size="8" font-weight="bold" fill="#4f46e5" text-anchor="middle">CALABARZON 2026</text>
    </g>

    <line x1="360" y1="925" x2="520" y2="925" stroke="#333" stroke-width="1.5"/>
    <path d="M 370 920 Q 410 880 450 920 T 510 910" fill="none" stroke="#4338ca" stroke-width="2"/>
    <text x="440" y="940" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">MARITESS S. CASTRO</text>
    <text x="440" y="954" font-size="9" fill="#64748b" text-anchor="middle">Regional Director, DOT Region IV-A</text>

    <line x1="560" y1="925" x2="710" y2="925" stroke="#333" stroke-width="1.5"/>
    <path d="M 570 915 Q 610 880 650 915 T 700 910" fill="none" stroke="#312e81" stroke-width="2.5"/>
    <text x="635" y="940" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">USEC. FERDINAND C. JUMAPAO</text>
    <text x="635" y="954" font-size="9" fill="#64748b" text-anchor="middle">Undersecretary for Tourism Regulation</text>
  </g>
