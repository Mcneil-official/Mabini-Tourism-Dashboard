    <text x="105" y="458" font-size="22" font-weight="bold" fill="#312e81" font-family="'Courier New', monospace">DOT-RO4A-2026-0091</text>

    <text x="390" y="425" font-size="11" fill="#64748b" font-weight="bold">TIER RATING</text>
    <text x="390" y="455" font-size="14" font-weight="bold" fill="#0f172a">Premium Dive Resort</text>

    <text x="560" y="425" font-size="11" fill="#64748b" font-weight="bold">ACCREDITATION VALIDITY</text>
    <text x="560" y="455" font-size="14" font-weight="bold" fill="#15803d">October 31, 2027</text>

    <text x="80" y="520" font-size="13" fill="#475569">Be it known that the tourism establishment:</text>

    <rect x="80" y="535" width="640" height="58" rx="4" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="105" y="572" font-size="20" font-weight="bold" fill="#312e81">DEEP BLUE CHARTERS</text>

    <text x="80" y="625" font-size="12" fill="#64748b">Registered Business Address:</text>
    <text x="290" y="625" font-size="13" font-weight="bold" fill="#0f172a">San Teodoro, Mabini, Batangas</text>

    <text x="80" y="655" font-size="12" fill="#64748b">Tourism Standards Inspection:</text>
    <text x="290" y="655" font-size="13" font-weight="bold" fill="#15803d">100% COMPLIANT (National Tourism Standards)</text>

    <text x="80" y="685" font-size="12" fill="#64748b">Environmental Sustainability:</text>
    <text x="290" y="685" font-size="13" font-weight="bold" fill="#15803d">Eco-Certified Marine Conservation Participant</text>

    <text x="80" y="715" font-size="12" fill="#64748b">Accreditation Code:</text>
    <text x="290" y="715" font-size="13" font-weight="bold" fill="#0f172a">RA 9593 - The Tourism Act of 2009</text>

    <rect x="80" y="745" width="640" height="65" rx="4" fill="#fdf4ff" stroke="#f0abfc"/>
    <text x="95" y="770" font-size="10.5" fill="#701a75">ISSUED PURSUANT TO REPUBLIC ACT NO. 9593 AND REVISED RULES GOVERNING STANDARDS</text>
    <text x="95" y="788" font-size="10.5" fill="#701a75">OF TOURISM ESTABLISHMENTS. ENTITLED TO ALL BENEFITS UNDER THE TOURISM PROMOTIONS ACT.</text>
  </g>

  <!-- Seal and Signatures -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(180, 895) rotate(6)">
