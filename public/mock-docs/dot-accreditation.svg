      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="760" height="1010" rx="8" fill="url(#dotBg)" stroke="url(#goldRibbon)" stroke-width="8"/>
  <rect x="36" y="36" width="728" height="978" rx="4" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 5"/>

  <g text-anchor="middle" font-family="Georgia, serif">
    <text x="400" y="90" font-size="13" fill="#64748b" letter-spacing="2">REPUBLIC OF THE PHILIPPINES</text>
    <text x="400" y="115" font-size="18" font-weight="bold" fill="#312e81" letter-spacing="2">DEPARTMENT OF TOURISM</text>
    <text x="400" y="138" font-size="13" fill="#4338ca" letter-spacing="1">REGIONAL OFFICE IV-A (CALABARZON)</text>

    <!-- DOT Sun and Flag Symbol -->
    <circle cx="400" cy="215" r="36" fill="#4338ca" opacity="0.1"/>
    <circle cx="400" cy="215" r="32" fill="none" stroke="#4338ca" stroke-width="2"/>
    <polygon points="400,195 405,208 418,208 408,216 412,228 400,220 388,228 392,216 382,208 395,208" fill="#eab308"/>
    <text x="400" y="265" font-size="10" font-weight="bold" fill="#312e81" letter-spacing="1">PRIMARY TOURISM ENTERPRISE (PTE)</text>

    <!-- Title -->
    <text x="400" y="325" font-size="34" font-weight="bold" fill="#312e81" letter-spacing="3">ACCREDITATION CERTIFICATE</text>
    <text x="400" y="352" font-size="14" font-weight="bold" fill="#4f46e5" letter-spacing="2">TOURISM RECREATIONAL FACILITY - DIVE RESORT</text>
    <line x1="200" y1="368" x2="600" y2="368" stroke="#6366f1" stroke-width="2"/>
  </g>

  <!-- Details -->
  <g font-family="Arial, sans-serif" fill="#1e293b">
