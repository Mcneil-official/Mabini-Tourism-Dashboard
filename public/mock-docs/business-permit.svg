<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#fdf6e7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Certificate Background -->
  <rect x="20" y="20" width="760" height="1010" rx="8" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#shadow)"/>
  <rect x="36" y="36" width="728" height="978" rx="4" fill="none" stroke="#daa520" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Official Header -->
  <g text-anchor="middle" font-family="Georgia, serif">
    <text x="400" y="90" font-size="14" fill="#666" letter-spacing="2">REPUBLIC OF THE PHILIPPINES</text>
    <text x="400" y="112" font-size="14" fill="#666" letter-spacing="1">PROVINCE OF BATANGAS</text>
    <text x="400" y="136" font-size="18" font-weight="bold" fill="#1e3a8a" letter-spacing="2">MUNICIPALITY OF MABINI</text>
    <text x="400" y="160" font-size="13" font-style="italic" fill="#555">OFFICE OF THE MUNICIPAL MAYOR</text>
    <text x="400" y="178" font-size="11" fill="#777">BPLO Tourism Licensing &amp; Operations Division</text>

    <!-- Municipal Seal Placeholder Emblem -->
    <circle cx="400" cy="235" r="38" fill="#1e3a8a" opacity="0.1"/>
    <circle cx="400" cy="235" r="34" fill="none" stroke="#1e3a8a" stroke-width="2"/>
    <polygon points="400,210 408,226 426,226 412,236 418,252 400,242 382,252 388,236 374,226 392,226" fill="#daa520"/>
    <text x="400" y="282" font-size="10" font-weight="bold" fill="#1e3a8a" letter-spacing="1">OFFICIAL SEAL • MABINI, BATANGAS</text>

    <!-- Title -->
    <text x="400" y="340" font-size="34" font-weight="bold" fill="#854d0e" letter-spacing="4">BUSINESS PERMIT</text>
    <text x="400" y="368" font-size="16" font-weight="bold" fill="#1e3a8a" letter-spacing="3">MAYOR'S PERMIT TO OPERATE</text>
    <line x1="200" y1="382" x2="600" y2="382" stroke="#daa520" stroke-width="2"/>
  </g>

  <!-- Permit Details -->
  <g font-family="Arial, sans-serif" fill="#222">
    <!-- Permit Plate Box -->
    <rect x="80" y="410" width="640" height="90" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="105" y="440" font-size="11" fill="#64748b" font-weight="bold">PERMIT NUMBER</text>
    <text x="105" y="475" font-size="22" font-weight="bold" fill="#0f172a" font-family="'Courier New', monospace">MMDR-2026-0812</text>

    <text x="360" y="440" font-size="11" fill="#64748b" font-weight="bold">DATE ISSUED</text>
    <text x="360" y="470" font-size="14" font-weight="bold" fill="#0f172a">January 15, 2026</text>

    <text x="540" y="440" font-size="11" fill="#64748b" font-weight="bold">VALID UNTIL</text>
    <text x="540" y="470" font-size="14" font-weight="bold" fill="#15803d">December 31, 2026</text>

    <!-- Main Body Details -->
    <text x="80" y="540" font-size="13" fill="#475569">This certifies that the business enterprise named below:</text>
    
    <rect x="80" y="555" width="640" height="60" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="105" y="592" font-size="20" font-weight="bold" fill="#1e3a8a">DEEP BLUE CHARTERS &amp; RESORT</text>

    <text x="80" y="645" font-size="12" fill="#64748b">Registered Owner / Representative:</text>
    <text x="300" y="645" font-size="13" font-weight="bold" fill="#0f172a">M. KALUA / ACCREDITED OPERATOR</text>

    <text x="80" y="675" font-size="12" fill="#64748b">Business Address / Location:</text>
    <text x="300" y="675" font-size="13" font-weight="bold" fill="#0f172a">Barangay San Teodoro, Mabini, Batangas</text>

    <text x="80" y="705" font-size="12" fill="#64748b">Line of Business / Classification:</text>
    <text x="300" y="705" font-size="13" font-weight="bold" fill="#0f172a">Scuba Diving Resort &amp; Tourist Boat Operations</text>

    <text x="80" y="735" font-size="12" fill="#64748b">Municipal Ordinance Compliance:</text>
    <text x="300" y="735" font-size="13" font-weight="bold" fill="#15803d">CLEARED (Batas Bayan No. 2022-04)</text>

    <!-- Terms Statement -->
    <rect x="80" y="760" width="640" height="70" rx="4" fill="#fefce8" stroke="#fef08a"/>
    <text x="95" y="785" font-size="10.5" fill="#713f12">SUBJECT TO REVOCATION UPON VIOLATION OF MUNICIPAL REVENUE CODE, DIVE SAFETY LAWS,</text>
    <text x="95" y="803" font-size="10.5" fill="#713f12">ENVIRONMENTAL SANCTUARY GUIDELINES, OR NON-PAYMENT OF MUNICIPAL DIVE FEES.</text>
    <text x="95" y="821" font-size="10.5" font-weight="bold" fill="#854d0e">MUST BE CONSPICUOUSLY DISPLAYED AT THE PLACE OF BUSINESS AT ALL TIMES.</text>
  </g>

  <!-- Signatures & Verification Stamp -->
  <g font-family="Arial, sans-serif">
    <!-- Official Stamp -->
    <g transform="translate(180, 910) rotate(-12)">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 3"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#dc2626" stroke-width="1.5"/>
      <text x="0" y="-18" font-size="8.5" font-weight="bold" fill="#dc2626" text-anchor="middle">MUNICIPALITY OF MABINI</text>
      <text x="0" y="2" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">VERIFIED</text>
      <text x="0" y="16" font-size="8" font-weight="bold" fill="#dc2626" text-anchor="middle">BPLO OFFICE</text>
      <text x="0" y="28" font-size="7.5" fill="#dc2626" text-anchor="middle">LICENSING 2026</text>
    </g>

    <!-- Signatures -->
    <g text-anchor="center">
      <!-- BPLO Officer -->
      <line x1="360" y1="940" x2="520" y2="940" stroke="#333" stroke-width="1.5"/>
      <path d="M 370 935 Q 400 905 440 925 T 510 930" fill="none" stroke="#1e3a8a" stroke-width="2"/>
      <text x="440" y="955" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">ATTY. CARLOS M. RAMOS</text>
      <text x="440" y="969" font-size="9" fill="#64748b" text-anchor="middle">Head, Business Permit &amp; Licensing</text>

      <!-- Mayor -->
      <line x1="560" y1="940" x2="710" y2="940" stroke="#333" stroke-width="1.5"/>
      <path d="M 570 930 Q 610 895 650 930 T 700 925" fill="none" stroke="#15803d" stroke-width="2.5"/>
      <text x="635" y="955" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">HON. ATTY. NOEL LUISTRO</text>
      <text x="635" y="969" font-size="9" fill="#64748b" text-anchor="middle">Municipal Mayor, Mabini</text>
    </g>
  </g>
</svg>
